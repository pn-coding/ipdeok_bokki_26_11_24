
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인페이지</title>

  <!-- Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="로고">
      </a>

      <button class="menu-btn" id="menuOpen" aria-label="메뉴 열기">
        <i data-lucide="menu"></i>
      </button>

    </header>


    <!-- HERO -->
    <section class="hero"></section>


    <!-- SECTION 1 : ORDER -->
    <section class="section-order">

      <button class="order-btn primary">
        <a href="sub/lists/lists.html">배달 주문하기</a>
      </button>

      <div class="order-row">
        <button class="order-btn">전화 주문</button>
        <button class="order-btn">쿠폰 사용</button>
      </div>

    </section>


    <!-- SECTION 2 : RECOMMEND -->
    <section class="section-recommend">

      <h2 class="section-title">추천 메뉴</h2>

      <div class="tag-list">
        <button class="tag active">추천 메뉴</button>
        <button class="tag">인기 메뉴</button>
        <button class="tag">신메뉴</button>
      </div>

      <div class="recommend-list">

        <div class="recommend-card side-card">
          <img src="./images/recommend-01.jpg" alt="추천 메뉴 1">
        </div>

        <div class="recommend-card featured">

          <div class="recommend-info">
            <span class="recommend-label">BEST 1</span>
            <p>맥주에 토핑을 더한</p>
            <strong>추천 메뉴</strong>
            <button class="more-btn">자세히 보기</button>
          </div>

          <div class="recommend-image">
            <img src="./images/recommend-02.jpg" alt="추천 메뉴 2">
          </div>

        </div>

        <div class="recommend-card side-card">
          <img src="./images/recommend-03.jpg" alt="추천 메뉴 3">
        </div>

      </div>

    </section>


    <!-- SECTION 3 : MENU -->
    <section class="section-menu">

      <h2 class="section-title">메뉴</h2>

      <div class="tag-list">
        <button class="tag active">탭 메뉴 1</button>
        <button class="tag">탭 메뉴 2</button>
        <button class="tag">탭 메뉴 3</button>
      </div>

      <div class="menu-grid">

        <div class="menu-card">
          <div class="menu-image">
            <img src="./images/menu-01.jpg" alt="메뉴 이미지 1">
          </div>
          <p class="menu-name">맥주에 어울리는 메뉴</p>
        </div>

        <div class="menu-card">
          <div class="menu-image">
            <img src="./images/menu-02.jpg" alt="메뉴 이미지 2">
          </div>
          <p class="menu-name">맥주에 어울리는 메뉴</p>
        </div>

        <div class="menu-card">
          <div class="menu-image">
            <img src="./images/menu-03.jpg" alt="메뉴 이미지 3">
          </div>
          <p class="menu-name">맥주에 어울리는 메뉴</p>
        </div>

        <div class="menu-card">
          <div class="menu-image">
            <img src="./images/menu-04.jpg" alt="메뉴 이미지 4">
          </div>
          <p class="menu-name">맥주에 어울리는 메뉴</p>
        </div>

      </div>

    </section>


    <!-- SECTION 4 : EVENT -->
    <section class="section-event">

      <h2 class="section-title">이벤트</h2>

      <p class="event-desc">
        매월 진행되는 다양한 이벤트를 확인해보세요!
      </p>

      <div class="event-tabs">
        <button class="event-tab active">진행중</button>
        <button class="event-tab">종료</button>
        <button class="event-tab">당첨자</button>
      </div>

      <div class="event-list">

        <article class="event-card">

          <div class="event-image">
            <img src="./images/event-01.jpg" alt="이벤트 이미지">
          </div>

          <div class="event-content">
            <p class="event-category">[매장명 이벤트]</p>

            <h3 class="event-title">
              매장 오픈을 기념하여 진행하는 특별 이벤트 안내입니다.
            </h3>

            <p class="event-date">2026. 11. 24</p>
          </div>

        </article>

      </div>

    </section>

     <!-- SIDE MENU -->
    <nav class="side-menu" id="sideMenu">

        <div class="side-menu-header">
          
          <button class="menu-close" id="menuClose" aria-label="메뉴 닫기">
              <i data-lucide="x"></i>
          </button>
        </div>

        <ul class="side-menu-list">
            <li><a href="sub/lists/lists.html">떡볶이 메뉴</a></li>
            <li><a href="#">소개</a></li>
            <li><a href="#">커뮤니티</a></li>
            <li><a href="#">로그인</a></li>
        </ul>

    </nav>


  </div>


  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay"></div>


 

  <!-- JAVASCRIPT -->
  <script>
    lucide.createIcons();

    const menuOpen = document.getElementById('menuOpen');
    const menuClose = document.getElementById('menuClose');
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');

    // 메뉴 열기
    function openMenu() {
      sideMenu.classList.add('active');
      menuOverlay.classList.add('active');
      document.body.classList.add('menu-open');
    }

    // 메뉴 닫기
    function closeMenu() {
      sideMenu.classList.remove('active');
      menuOverlay.classList.remove('active');
      document.body.classList.remove('menu-open');
    }

    // 버튼 클릭 이벤트
    menuOpen.addEventListener('click', openMenu);
    menuClose.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);

    // 메뉴 선택 시 닫기
    document.querySelectorAll('.side-menu-list a').forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // ESC 키로 닫기
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu();
      }
    });
  </script>

</body>
</html>
